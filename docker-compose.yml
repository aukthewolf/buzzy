version: "3.9"
services:
  app:
    platform: "linux/amd64"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLIENTVAR: "clientvar"
    working_dir: /app
    #ports:
      #- "8030:3000"
    image: t3-app
    #environment:
    networks:
      - postgres
      - npm-net

networks:
  postgres:
    external: true
  npm-net:
    external: true
